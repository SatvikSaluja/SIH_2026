[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/bhoomi-ai build"
  publish = "artifacts/bhoomi-ai/dist/public"

[build.environment]
  NODE_VERSION = "20"

# The frontend calls relative /api/* paths (artifacts/bhoomi-ai/src/utils/backend.ts
# and src/operator/{api,workspace}.ts). This rule is what serves them in production,
# and artifacts/bhoomi-ai/vite.config.ts mirrors it exactly in development, so a
# route that works locally works deployed.
#
# That equivalence is new. This redirect always sent /api/* straight to the Python
# backend, but the region/parcel/processing-run translation used to live only in
# artifacts/api-server, which production never routes through -- so /dashboard,
# /regions, /parcels, /changes, /processing/runs and /exports returned 200 locally
# and 404 here. Those now live in geocadastra/api/console.py, on the far side of
# this redirect.
[[redirects]]
  from = "/api/*"
  to = "https://geocadastra-api.onrender.com/:splat"
  status = 200
  force = true

# KNOWN GAP: /api/sentinel/* is NOT covered by the rule above and will 404 in
# production. Geo-VLM Sentinel is still served by artifacts/api-server (its own
# JSON store plus a Gemini client); the Python backend has no /sentinel route.
# Deploying that server, or porting Sentinel onto the Python side's own vision
# endpoint, is the open decision -- until then the Sentinel page is dev-only.

# SPA fallback -- must come after the /api rule above, not before.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
