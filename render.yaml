services:
  - type: web
    name: geocadastra-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /wards
    envVars:
      - key: GEOCADASTRA_DB_URL
        fromDatabase:
          name: geocadastra-db-v2
          property: connectionString
      - key: GEOCADASTRA_DB_SCHEMA
        value: public
      - key: GEOCADASTRA_CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: geocadastra-redis-v2
          property: connectionString
      - key: GEOCADASTRA_CORS_ORIGINS
        # The frontend never calls this origin directly -- it calls its own
        # origin's /api/*, which geocadastra-frontend's own rewrite rule
        # (below) proxies here server-side, so the browser never makes a
        # cross-origin request in the deployed path and this value doesn't
        # gate that traffic. It's real CORS for anyone hitting this backend
        # directly from a browser (this project's own operator console
        # during local dev, or a future second frontend), scoped to the
        # actual deployed frontend origin rather than left as a wildcard.
        value: "https://geocadastra-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173"

  - type: web
    name: geocadastra-frontend
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/bhoomi-ai build
    staticPublishPath: artifacts/bhoomi-ai/dist/public
    routes:
      # Mirrors vite.config.ts's dev proxy exactly: strip /api, forward the
      # rest to the real backend. Order matters -- this must come before the
      # SPA catch-all, or /api/* would resolve to index.html instead.
      #
      # KNOWN GAP: /api/sentinel/* is NOT covered by this rule and 404s here.
      # Geo-VLM Sentinel is still served by artifacts/api-server (its own
      # JSON store plus a Gemini client), which has no deployment target of
      # its own yet -- deploying it, or porting Sentinel onto this backend's
      # own vision endpoint, is the open decision. Until then the Sentinel
      # page only works in local dev.
      - type: rewrite
        source: /api/*
        destination: https://geocadastra-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: worker
    name: geocadastra-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: GEOCADASTRA_DB_URL
        fromDatabase:
          name: geocadastra-db-v2
          property: connectionString
      - key: GEOCADASTRA_DB_SCHEMA
        value: public
      - key: GEOCADASTRA_CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: geocadastra-redis-v2
          property: connectionString

  - type: keyvalue
    name: geocadastra-redis-v2
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: geocadastra-db-v2
    databaseName: geocadastra
    plan: free
    postgresMajorVersion: "16"
