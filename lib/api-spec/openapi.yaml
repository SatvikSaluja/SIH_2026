openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: sentinel
    description: Evidence-first rural survey analysis operations
  - name: health
    description: Health operations
  - name: command-center
    description: BhoomiAI command center data
  - name: processing
    description: GeoAI processing and topology actions
  - name: parcels
    description: Extracted parcel and change records
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [command-center]
      summary: Get command center summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /regions:
    get:
      operationId: listRegions
      tags: [command-center]
      summary: List available regions
      responses:
        "200":
          description: Regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"
  /parcels:
    get:
      operationId: listParcels
      tags: [parcels]
      summary: List extracted parcels
      parameters:
        - name: regionId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Parcels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parcel"
  /parcels/{id}:
    get:
      operationId: getParcel
      tags: [parcels]
      summary: Get parcel details
      parameters:
        - $ref: "#/components/parameters/ParcelId"
      responses:
        "200":
          description: Parcel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcel"
        "404":
          description: Parcel not found
    patch:
      operationId: updateParcel
      tags: [parcels]
      summary: Update parcel status or geometry
      parameters:
        - $ref: "#/components/parameters/ParcelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParcelUpdate"
      responses:
        "200":
          description: Updated parcel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcel"
  /processing/runs:
    get:
      operationId: listProcessingRuns
      tags: [processing]
      summary: List recent processing runs
      responses:
        "200":
          description: Processing runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessingRun"
    post:
      operationId: createProcessingRun
      tags: [processing]
      summary: Start an inference run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessingRunInput"
      responses:
        "201":
          description: Processing run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingRun"
  /topology/scan:
    post:
      operationId: scanTopology
      tags: [processing]
      summary: Scan parcel topology
      responses:
        "200":
          description: Topology report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyReport"
  /topology/fix:
    post:
      operationId: fixTopology
      tags: [processing]
      summary: Auto-fix topology errors
      responses:
        "200":
          description: Fixed topology report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyReport"
  /changes:
    get:
      operationId: listChanges
      tags: [parcels]
      summary: List temporal change detections
      responses:
        "200":
          description: Change detections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeDetection"
  /exports:
    post:
      operationId: createExport
      tags: [command-center]
      summary: Create a GIS export package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "201":
          description: Export package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
  /sentinel/overview:
    get:
      operationId: getSentinelOverview
      tags: [sentinel]
      summary: Get Sentinel workspace overview
      responses:
        "200":
          description: Current workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentinelOverview"
  /sentinel/analyses:
    get:
      operationId: listAnalyses
      tags: [sentinel]
      summary: List recent media analyses
      responses:
        "200":
          description: Recent analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"
    post:
      operationId: createAnalysis
      tags: [sentinel]
      summary: Save an analysis record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "201":
          description: Saved analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /sentinel/analyze-media:
    post:
      operationId: analyzeMedia
      tags: [sentinel]
      summary: Analyze uploaded image or sampled video frames
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultimodalAnalysisInput"
      responses:
        "201":
          description: AI-generated analysis with linked evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisDetail"
        "400":
          description: Invalid media payload
        "503":
          description: Multimodal provider unavailable
  /sentinel/analyses/{analysisId}:
    get:
      operationId: getAnalysis
      tags: [sentinel]
      summary: Get an analysis with linked evidence
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Analysis detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisDetail"
        "404":
          description: Analysis not found
    patch:
      operationId: verifyAnalysis
      tags: [sentinel]
      summary: Record a human verification decision
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationInput"
      responses:
        "200":
          description: Updated analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Analysis not found
  /sentinel/analyses/{analysisId}/report:
    get:
      operationId: getAnalysisReport
      tags: [sentinel]
      summary: Get a preliminary evidence report
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Report payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisReport"
        "404":
          description: Analysis not found
components:
  parameters:
    ParcelId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Region:
      type: object
      required: [id, name, type, processedSqKm, parcelCount, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        processedSqKm: { type: number }
        parcelCount: { type: integer }
        updatedAt: { type: string }
    DashboardSummary:
      type: object
      required: [areaProcessedSqKm, parcelsExtracted, topologyErrors, encroachments, accuracyScore, activeRun, recentActivity]
      properties:
        areaProcessedSqKm: { type: number }
        parcelsExtracted: { type: integer }
        topologyErrors: { type: integer }
        encroachments: { type: integer }
        accuracyScore: { type: number }
        activeRun:
          oneOf:
            - $ref: "#/components/schemas/ProcessingRun"
            - type: "null"
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
    Activity:
      type: object
      required: [id, title, detail, time, tone]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        time: { type: string }
        tone: { type: string }
    Parcel:
      type: object
      required: [id, ulpin, regionId, regionName, areaSqM, ownership, confidence, status, geometry, updatedAt]
      properties:
        id: { type: string }
        ulpin: { type: string }
        regionId: { type: string }
        regionName: { type: string }
        areaSqM: { type: number }
        ownership: { type: string }
        confidence: { type: number }
        status: { type: string }
        geometry:
          type: array
          items:
            type: array
            items: { type: number }
        updatedAt: { type: string }
    ParcelUpdate:
      type: object
      properties:
        status: { type: string }
        geometry:
          type: array
          items:
            type: array
            items: { type: number }
    ProcessingRun:
      type: object
      required: [id, name, regionId, regionName, status, progress, currentStep, steps, startedAt]
      properties:
        id: { type: string }
        name: { type: string }
        regionId: { type: string }
        regionName: { type: string }
        status: { type: string }
        progress: { type: integer }
        currentStep: { type: string }
        steps:
          type: array
          items: { type: string }
        startedAt: { type: string }
    ProcessingRunInput:
      type: object
      required: [regionId, dataset]
      properties:
        regionId: { type: string }
        dataset: { type: string }
    TopologyReport:
      type: object
      required: [scannedAt, errorCount, fixedCount, overlapCount, sliverCount, ringCount, status]
      properties:
        scannedAt: { type: string }
        errorCount: { type: integer }
        fixedCount: { type: integer }
        overlapCount: { type: integer }
        sliverCount: { type: integer }
        ringCount: { type: integer }
        status: { type: string }
    ChangeDetection:
      type: object
      required: [id, title, regionName, category, areaSqM, detectedAt, severity]
      properties:
        id: { type: string }
        title: { type: string }
        regionName: { type: string }
        category: { type: string }
        areaSqM: { type: number }
        detectedAt: { type: string }
        severity: { type: string }
    ExportInput:
      type: object
      required: [format, regionId]
      properties:
        format: { type: string }
        regionId: { type: string }
    ExportJob:
      type: object
      required: [id, format, regionId, status, createdAt, fileName]
      properties:
        id: { type: string }
        format: { type: string }
        regionId: { type: string }
        status: { type: string }
        createdAt: { type: string }
        fileName: { type: string }


    SentinelOverview:
      type: object
      required:
        - totalAnalyses
        - pendingReview
        - verified
        - needsAttention
        - latestAnalysis
      properties:
        totalAnalyses:
          type: integer
        pendingReview:
          type: integer
        verified:
          type: integer
        needsAttention:
          type: integer
        latestAnalysis:
          anyOf:
            - $ref: "#/components/schemas/Analysis"
            - type: "null"
    Analysis:
      type: object
      required:
        - id
        - title
        - sourceType
        - sourceName
        - status
        - createdAt
        - observationCount
        - verifiedObservationCount
        - hasGeospatialMetadata
        - captureDate
        - modelLabel
      properties:
        id:
          type: string
        title:
          type: string
        sourceType:
          type: string
          enum: [image, video]
        sourceName:
          type: string
        status:
          type: string
          enum: [processing, needs_review, verified, needs_attention]
        createdAt:
          type: string
        observationCount:
          type: integer
        verifiedObservationCount:
          type: integer
        hasGeospatialMetadata:
          type: boolean
        captureDate:
          type: ["string", "null"]
        modelLabel:
          type: string
    AnalysisInput:
      type: object
      required:
        - title
        - sourceType
        - sourceName
        - status
        - observationCount
        - hasGeospatialMetadata
        - captureDate
        - modelLabel
      properties:
        title:
          type: string
        sourceType:
          type: string
          enum: [image, video]
        sourceName:
          type: string
        status:
          type: string
          enum: [processing, needs_review, verified, needs_attention]
        observationCount:
          type: integer
        hasGeospatialMetadata:
          type: boolean
        captureDate:
          type: ["string", "null"]
        modelLabel:
          type: string
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ObservationInput"
    MultimodalAnalysisInput:
      type: object
      required:
        - title
        - sourceType
        - sourceName
        - hasGeospatialMetadata
        - captureDate
        - mediaData
        - mediaMimeType
      properties:
        title:
          type: string
        sourceType:
          type: string
          enum: [image, video]
        sourceName:
          type: string
        hasGeospatialMetadata:
          type: boolean
        captureDate:
          type: ["string", "null"]
        mediaData:
          type: string
          description: Base64-encoded image or representative media payload without the data URI prefix.
        mediaMimeType:
          type: string
        frames:
          type: array
          items:
            $ref: "#/components/schemas/MediaFrameInput"
    MediaFrameInput:
      type: object
      required:
        - data
        - mimeType
        - timestampSeconds
      properties:
        data:
          type: string
        mimeType:
          type: string
        timestampSeconds:
          type: number
    Observation:
      type: object
      required:
        - id
        - label
        - category
        - confidence
        - reviewStatus
        - evidenceNote
        - timestampSeconds
        - sourceMedia
      properties:
        id:
          type: string
        label:
          type: string
        category:
          type: string
        confidence:
          type: number
        reviewStatus:
          type: string
          enum: [unreviewed, confirmed, dismissed]
        evidenceNote:
          type: string
        timestampSeconds:
          type: ["number", "null"]
        sourceMedia:
          type: string
    ObservationInput:
      type: object
      required:
        - label
        - category
        - confidence
        - reviewStatus
        - evidenceNote
        - timestampSeconds
        - sourceMedia
      properties:
        label:
          type: string
        category:
          type: string
        confidence:
          type: number
        reviewStatus:
          type: string
          enum: [unreviewed, confirmed, dismissed]
        evidenceNote:
          type: string
        timestampSeconds:
          type: ["number", "null"]
        sourceMedia:
          type: string
    AnalysisDetail:
      allOf:
        - $ref: "#/components/schemas/Analysis"
        - type: object
          required:
            - observations
          properties:
            observations:
              type: array
              items:
                $ref: "#/components/schemas/Observation"
    VerificationInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [needs_review, verified, needs_attention]
    AnalysisReport:
      type: object
      required:
        - generatedAt
        - title
        - disclaimer
        - analysis
      properties:
        generatedAt:
          type: string
        title:
          type: string
        disclaimer:
          type: string
        analysis:
          $ref: "#/components/schemas/AnalysisDetail"

